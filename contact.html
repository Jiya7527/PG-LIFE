<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - PG Rent Services</title>
    <link rel="stylesheet" href="./style.css">
    <style>
        .contact {
            background: url('./images/header-background.jpg') no-repeat center center/cover;
            color: #fff;
            padding: 60px 20px;
        }

        .contact .section-title {
            font-size: 2rem;
            text-align: center;
            margin-bottom: 40px;
        }

        .contact-form {
            background-color: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            max-width: 400px;
            margin: 0 auto;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .contact-btn {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
        }

        .contact-details {
            margin-top: 30px;
            text-align: center;
        }

        .contact-details p {
            margin: 5px 0;
        }

        .contact-details h3 {
            margin-bottom: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <!-- Navbar Section -->
    <nav class="navbar">
        <div class="container">
            <div class="logo">JIYA</div>
            <ul class="nav-list">
                <li><a href="testimonials.html" class="list-item">Testimonials</a></li>
                <li><a href="about.html" class="list-item">About Us</a></li>
                <li><a href="contact.html" class="list-item contact">Contact Us</a></li>
            </ul>
        </div>
    </nav>

    <!-- Contact Section -->
    <section class="contact">
        <div class="container">
            <h2 class="section-title">Get In Touch</h2>
            <form class="contact-form">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" placeholder="Your Name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Your Email" required>
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" rows="5" placeholder="Your Message" required></textarea>
                </div>
                <button type="submit" class="contact-btn">Send Message</button>
            </form>
            <div class="contact-details">
                <h3>Contact Details</h3>
                <p><strong>Phone:</strong> +91-9876543210</p>
                <p><strong>Email:</strong> support@pglife.com</p>
                <p><strong>Address:</strong> 123, Residency Road, Chandigarh</p>
            </div>
        </div>
    </section>
